name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Dépôt public : jamais de runner auto-hébergé (une PR de fork y exécuterait son code).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt -c constraints.txt

      - name: Lancer les tests
        run: pytest tests/ -v
