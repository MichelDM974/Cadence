  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#e07b46" stroke-opacity=".35" stroke-width="1.5"/>
  <g stroke="#e07b46" stroke-linecap="round" fill="none" stroke-width="6">
    <path d="M43.3 20.7 A16 16 0 1 0 43.3 43.3"/>
    <path d="M43.3 43.3 A16 16 0 0 0 43.3 20.7" stroke-opacity=".55" stroke-dasharray="0.1 7.6"/>
  </g>
</svg>
